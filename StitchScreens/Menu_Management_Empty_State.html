<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Menu Management - Motherland</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#574500",
                        "secondary-container": "#454747",
                        "error": "#ffb4ab",
                        "tertiary-container": "#c9b16a",
                        "inverse-primary": "#735c00",
                        "primary-fixed-dim": "#e9c349",
                        "surface-container-highest": "#353534",
                        "on-tertiary-fixed-variant": "#564506",
                        "on-secondary": "#2f3131",
                        "primary-container": "#d4af37",
                        "on-primary": "#3c2f00",
                        "outline-variant": "#4d4635",
                        "secondary": "#c6c6c7",
                        "primary-fixed": "#ffe088",
                        "surface-container-lowest": "#0e0e0e",
                        "on-error-container": "#ffdad6",
                        "on-secondary-container": "#b4b5b5",
                        "surface-container": "#201f1f",
                        "on-primary-container": "#554300",
                        "surface": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "primary": "#f2ca50",
                        "on-surface": "#e5e2e1",
                        "on-primary-fixed": "#241a00",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-tertiary-container": "#544304",
                        "error-container": "#93000a",
                        "on-tertiary": "#3c2f00",
                        "on-tertiary-fixed": "#231b00",
                        "on-background": "#e5e2e1",
                        "surface-variant": "#353534",
                        "surface-bright": "#393939",
                        "tertiary-fixed-dim": "#ddc57b",
                        "background": "#131313",
                        "inverse-surface": "#e5e2e1",
                        "tertiary": "#e6cd82",
                        "inverse-on-surface": "#313030",
                        "on-error": "#690005",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-dim": "#131313",
                        "surface-tint": "#e9c349",
                        "surface-container-low": "#1c1b1b",
                        "on-surface-variant": "#d0c5af",
                        "on-secondary-fixed": "#1a1c1c",
                        "outline": "#99907c",
                        "secondary-fixed": "#e2e2e2",
                        "tertiary-fixed": "#fbe194"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sidebar-width": "280px",
                        "margin": "32px",
                        "sm": "16px",
                        "base": "4px",
                        "md": "24px",
                        "xs": "8px",
                        "xl": "64px",
                        "gutter": "24px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"],
                        "headline-md": ["Playfair Display"],
                        "label-md": ["Inter"],
                        "display-lg": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-screen overflow-hidden flex">
<!-- SideNavBar (Hidden on Mobile) -->
<nav class="hidden md:flex bg-background border-r border-outline-variant flex-col h-full py-md docked left-0 w-sidebar-width shrink-0 z-20 relative">
<div class="px-margin mb-xl">
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Motherland</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-1 uppercase tracking-wider">Cafe Administration</p>
</div>
<div class="flex-1 px-sm space-y-1">
<!-- Active Tab: Menu -->
<a class="flex items-center px-4 py-3 rounded-r-full font-label-md text-label-md text-on-surface border-l-4 border-primary bg-surface-container-low transition-colors group" href="#">
<span class="material-symbols-outlined mr-4 group-hover:scale-95 duration-150">restaurant_menu</span>
                Menu
            </a>
<a class="flex items-center px-4 py-3 rounded-r-full font-label-md text-label-md text-on-surface-variant hover:text-primary hover:bg-surface-container transition-colors group border-l-4 border-transparent" href="#">
<span class="material-symbols-outlined mr-4 text-on-surface-variant group-hover:text-primary transition-colors">photo_library</span>
                Gallery
            </a>
<a class="flex items-center px-4 py-3 rounded-r-full font-label-md text-label-md text-on-surface-variant hover:text-primary hover:bg-surface-container transition-colors group border-l-4 border-transparent" href="#">
<span class="material-symbols-outlined mr-4 text-on-surface-variant group-hover:text-primary transition-colors">rate_review</span>
                Reviews
            </a>
<a class="flex items-center px-4 py-3 rounded-r-full font-label-md text-label-md text-on-surface-variant hover:text-primary hover:bg-surface-container transition-colors group border-l-4 border-transparent" href="#">
<span class="material-symbols-outlined mr-4 text-on-surface-variant group-hover:text-primary transition-colors">event_available</span>
                Reservations
            </a>
</div>
<div class="px-sm mt-auto pt-md border-t border-surface-container-high">
<a class="flex items-center px-4 py-3 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-primary hover:bg-surface-container transition-colors group" href="#">
<span class="material-symbols-outlined mr-4">logout</span>
                Logout
            </a>
</div>
</nav>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col h-full bg-surface-lowest relative">
<!-- TopAppBar (Mobile Only - Simplified for Empty State context if needed, but per instructions we focus on the canvas. Assuming desktop-first view for the empty state) -->
<header class="md:hidden flex justify-between items-center w-full px-sm h-20 bg-background border-b border-outline-variant z-10 relative">
<h1 class="font-headline-md text-headline-md text-primary font-bold">Motherland</h1>
<button class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined">menu</span>
</button>
</header>
<!-- Canvas -->
<main class="flex-1 overflow-y-auto flex items-center justify-center p-margin">
<!-- Empty State Container -->
<div class="max-w-md w-full bg-surface-container rounded-xl border border-surface-container-highest p-xl flex flex-col items-center text-center shadow-lg transform transition-all hover:-translate-y-1 duration-300">
<!-- Illustration/Icon -->
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center mb-lg border border-outline-variant shadow-inner relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-surface-container-lowest to-transparent opacity-50"></div>
<span class="material-symbols-outlined text-tertiary-fixed-dim text-6xl opacity-80" style="font-size: 64px;">restaurant</span>
</div>
<!-- Text Content -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs font-bold">Menu is Empty</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl max-w-[280px]">
                    No menu items found. Start by adding your first dish to craft your culinary narrative.
                </p>
<!-- Action Button -->
<button class="bg-primary-container text-on-primary font-label-md text-label-md px-8 py-4 rounded-full uppercase tracking-wider hover:bg-primary transition-colors flex items-center gap-2 shadow-[0_4px_14px_rgba(212,175,55,0.2)] active:scale-95 duration-150">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Add New Item
                </button>
</div>
</main>
</div>
</body></html>
