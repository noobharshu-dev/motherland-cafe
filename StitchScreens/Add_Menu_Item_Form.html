<!DOCTYPE html><html class="dark" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            width: 6px;

            background: #131313;
        }
        ::-webkit-scrollbar-thumb {
            background: #353534;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4af37;
        }
    </style>

<body class="bg-background text-on-surface font-body-md min-h-screen overflow-hidden flex antialiased">
<!-- Blurred Background Context (Menu Management) -->
<div class="fixed inset-0 w-full h-full opacity-30 blur-sm pointer-events-none z-0" data-alt="A sophisticated, dark-themed dashboard interface showing a high-end cafe menu management system. The screen features rows of beautifully plated artisanal coffee and pastry dishes in a list format, accented with subtle brass-colored typography on charcoal grey cards." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCCm2jvKjk8kRPiX4aNs4tDItat4SyHGCnxTysnlvdM0B0q33C4DRhIrmkLO0znGuQpX0Pl-Skg4-d8w6RQcBCcKcPNEf_uOoyGf7zKsZeSg17ywhPpmYLiRBQR-vkceOKy-1ThefnGgT58imM6knGxJftO1p3npWLwSihtQHZWGsD0W-0U3g4vj6flWv3U3n83_gyAw6KltydAX915XbFBpKPpsQ1XTC1A4G8_A_GNo-fOqrW0UCvJ5vwOd8UU6PSxG3M-V2-nFw'); background-size: cover; background-position: center;"></div>
<div class="fixed inset-0 bg-background/80 z-0"></div>
<!-- Centered Modal Wrapper -->
<div class="relative z-10 w-full h-full flex items-center justify-center p-sm md:p-margin overflow-y-auto">
<!-- Modal Container -->
<div class="w-full max-w-2xl bg-[#1E1E1E] rounded-lg border border-[#2C2C2C] shadow-[0px_8px_24px_rgba(0,0,0,0.5)] flex flex-col max-h-[921px]">
<!-- Modal Header -->
<div class="flex justify-between items-center p-md border-b border-[#2C2C2C] shrink-0">
<h2 class="font-headline-md text-headline-md text-on-surface">Add Menu Item</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-md overflow-y-auto flex-1 space-y-md">
<!-- Image Upload Section -->
<div class="w-full">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs">Item Image</label>
<div class="w-full h-40 border-2 border-dashed border-[#4d4635] rounded-lg bg-[#121212] flex flex-col items-center justify-center cursor-pointer hover:border-primary hover:bg-[#1c1b1b] transition-all group">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary mb-2">add_photo_alternate</span>
<p class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-primary">Click to upload or drag &amp; drop</p>
<p class="font-label-md text-[10px] text-on-surface-variant/70 mt-1">PNG, JPG, WEBP (Max 2MB)</p>
</div>
</div>
<!-- Name and Price Row -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-md">
<div class="md:col-span-2 space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="item_name">Item Name</label>
<input class="w-full bg-[#121212] border border-[#2C2C2C] rounded-DEFAULT p-sm font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50" id="item_name" placeholder="e.g., Artisan Pour Over" type="text">
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="item_price">Price ($)</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">$</span>
<input class="w-full bg-[#121212] border border-[#2C2C2C] rounded-DEFAULT p-sm pl-[32px] font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50" id="item_price" placeholder="0.00" step="0.01" type="number">
</div>
</div>
</div>
<!-- Category and Tags Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="item_category">Category</label>
<select class="w-full bg-[#121212] border border-[#2C2C2C] rounded-DEFAULT p-sm font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all appearance-none cursor-pointer" id="item_category">
<option disabled="" selected="" value="">Select Category</option>
<option value="coffee">Coffee &amp; Espresso</option>
<option value="tea">Tea &amp; Infusions</option>
<option value="pastry">Pastries &amp; Baked Goods</option>
<option value="brunch">Brunch Plates</option>
<option value="seasonal">Seasonal Specials</option>
</select>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant">Dietary Tags</label>
<div class="flex flex-wrap gap-xs">
<label class="cursor-pointer group flex items-center bg-[#121212] border border-[#2C2C2C] rounded-full px-3 py-1.5 hover:border-primary transition-all">
<input class="hidden peer" type="checkbox" value="vegan">
<span class="font-body-sm text-body-sm text-on-surface-variant peer-checked:text-primary">Vegan</span>
</label>
<label class="cursor-pointer group flex items-center bg-[#121212] border border-[#2C2C2C] rounded-full px-3 py-1.5 hover:border-primary transition-all">
<input class="hidden peer" type="checkbox" value="vegetarian">
<span class="font-body-sm text-body-sm text-on-surface-variant peer-checked:text-primary">Vegetarian</span>
</label>
<label class="cursor-pointer group flex items-center bg-[#121212] border border-[#2C2C2C] rounded-full px-3 py-1.5 hover:border-primary transition-all">
<input class="hidden peer" type="checkbox" value="gluten-free">
<span class="font-body-sm text-body-sm text-on-surface-variant peer-checked:text-primary">Gluten-Free</span>
</label>
</div>
</div>
</div>
<!-- Description -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="item_desc">Description</label>
<textarea class="w-full bg-[#121212] border border-[#2C2C2C] rounded-DEFAULT p-sm font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none placeholder:text-on-surface-variant/50" id="item_desc" placeholder="Describe the flavor profile, ingredients, and origin..." rows="3"></textarea>
</div>
<!-- Featured Toggle -->
<div class="flex items-center justify-between p-sm bg-[#121212] border border-[#2C2C2C] rounded-lg">
<div>
<span class="block font-body-md text-on-surface">Feature on Homepage</span>
<span class="block font-body-sm text-on-surface-variant text-sm">Highlight this item in the "Seasonal Signatures" section.</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</div>
<!-- Modal Footer (Actions) -->
<div class="flex justify-end items-center gap-md p-md border-t border-[#2C2C2C] shrink-0 bg-[#1A1A1A] rounded-b-lg">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors uppercase" type="button">
                    Cancel
                </button>
<button class="bg-primary-container text-[#000000] font-label-md text-label-md px-xl py-xs rounded-DEFAULT hover:bg-primary transition-colors flex items-center gap-xs uppercase" type="button">
<span class="material-symbols-outlined text-[18px]">add</span>
                    Add Item
                </button>
</div>
</div>
</div>
</body></html>
